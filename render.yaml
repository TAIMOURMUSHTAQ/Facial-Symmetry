# Render Blueprint: one small Python web service that serves the app over HTTPS (needed for the camera)
# and proxies AI requests to OpenAI with the key kept on the server.
# Set OPENAI_API_KEY in the Render dashboard (Environment); it is never stored in the repository.
services:
  - type: web
    name: facial-symmetry-assistant
    runtime: python
    plan: free
    # Downloads the MediaPipe model + WASM into vendor/. If it fails, the app loads them from the CDN.
    buildCommand: bash scripts/fetch-vendor.sh || echo "vendor download failed, app will use the CDN fallback"
    startCommand: python3 server.py
    healthCheckPath: /api/ai/status
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5-mini
      - key: OPENAI_REASONING_EFFORT
        value: low
      - key: AI_RATE_LIMIT_PER_HOUR
        value: "60"
