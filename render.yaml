# Render Blueprint: deploys the app as a free static site with HTTPS (camera access requires HTTPS).
# In Render: New + > Blueprint > pick this repository. render.yaml must be at the repository root.
services:
  - type: web
    name: facial-symmetry-assistant
    runtime: static
    # Downloads the MediaPipe model + WASM into vendor/ so they are served from this site.
    # If the download fails the app still works by loading them from the CDN.
    buildCommand: bash scripts/fetch-vendor.sh || echo "vendor download failed, app will use the CDN fallback"
    staticPublishPath: .
    pullRequestPreviewsEnabled: false
    headers:
      - path: /*
        name: Permissions-Policy
        value: camera=(self), microphone=()
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /vendor/*
        name: Cache-Control
        value: public, max-age=604800
      - path: /src/*
        name: Cache-Control
        value: no-cache
