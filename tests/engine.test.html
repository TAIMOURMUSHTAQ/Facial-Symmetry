<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Engine tests</title><link rel="icon" href="data:,">
<style>body{font:14px system-ui;background:#111827;color:#e2e8f0;padding:20px}.pass{color:#34d399}.fail{color:#fb7185}</style></head>
<body>
<h1>Facial Symmetry tests (synthetic, therapist-led captures)</h1>
<ul id="out"></ul>
<script type="module">
import { summarize, summarizeAll } from "../src/engine/measure.js";
import { safetyFlags, SAFETY_QUESTIONS } from "../src/knowledge/safety.js";
import { compareVisits, trend } from "../src/engine/compare.js";
import { caseText } from "../src/ai/prompt.js";
import { MemoryStore } from "../src/store/index.js";
import { rec, routine, caseDataFor, CASES } from "./scenarios.js";

const tests = [];
const test = async (name, fn) => { try { const r = await fn(); tests.push({ name, ok: r === true, info: r === true ? "" : JSON.stringify(r) }); } catch (e) { tests.push({ name, ok: false, info: e.stack }); } };
const row = (m, id) => m.rows.find(r => r.id === id);

await test("Reference capture gives absolute right/left values and near-zero difference for a symmetric face", () => {
  const m = summarizeAll(routine())[0], brow = row(m, "brow");
  return (m.mode === "absolute" && m.reference && brow.diff <= 3) || { mode: m.mode, brow };
});
await test("Left weakness: change mode, left moves less, size of difference ~80%", () => {
  const smile = summarizeAll(routine({ L: .2 })).find(x => x.label === "Big smile"), r = row(smile, "mouthOut");
  return (smile.mode === "change" && r.smaller === "L" && r.diff >= 70 && r.diff <= 90 && r.R > 3) || { mode: smile.mode, r };
});
await test("Rows of a movement capture are ordered by size of change (eyebrow first for 'Raise eyebrows')", () => {
  const brow = summarizeAll(routine()).find(x => x.label === "Raise eyebrows");
  return brow.rows[0].id === "brow" || brow.rows.slice(0, 3).map(r => r.id);
});
await test("No reference recorded: every capture is shown as absolute values", () => {
  const ms = summarizeAll(routine().map(c => ({ ...c, reference: false })));
  return ms.every(m => m.mode === "absolute") || ms.map(m => m.mode);
});
await test("Capture with no usable frames is reported as not measurable, not as numbers", () => {
  const bad = { frames: rec(30).frames.map(f => ({ ...f, ok: false })), total: 30, noFace: 0, badPose: 30 };
  const m = summarize(bad, null, true);
  return (m.valid === false && /No usable frames/.test(m.reason)) || m;
});
await test("Long capture reports start-to-end lid change on the drooping side only", () => {
  const hold = summarizeAll(CASES.find(x => x.id === "myasthenia").captures())[1];
  return (hold.timeline && hold.timeline.startToEnd.upperLidL < -1.5 && Math.abs(hold.timeline.startToEnd.upperLidR) < 0.5) || hold.timeline;
});
await test("Twitch capture counts one-sided right eye closures", () => {
  const t = summarizeAll(CASES.find(x => x.id === "hemifacial_spasm").captures())[1].timeline;
  return (t && t.oneSidedEyeClosures.R >= 4 && t.oneSidedEyeClosures.L === 0) || t;
});
await test("Safety: nothing ticked -> no alerts", () => safetyFlags({}).length === 0 || safetyFlags({}));
await test("Safety: every rule has an action and a source; emergencies first", () => {
  const all = safetyFlags(Object.fromEntries(SAFETY_QUESTIONS.map(q => [q.key, true])));
  return (all.length >= 8 && all.every(f => f.action && f.source) && all[0].level === "emergency") || all;
});
await test("Safety: acute onset suppresses the 72-hour steroid note (stroke pathway takes over)", () => {
  const f = safetyFlags({ acute_neuro: true, onset_72h: true }).map(x => x.title);
  return (f.includes("Possible stroke") && !f.includes("Treatment window")) || f;
});
await test("Compare visits: matched by capture name (case-insensitive), left difference shrinks", () => {
  const mk = (L, date, lower) => ({ generatedAt: date, captures: summarizeAll(routine({ L }).map(c => ({ ...c, label: lower ? c.label.toLowerCase() : c.label }))) });
  const c = compareVisits(mk(.7, "2026-11-15T10:00:00Z", true), mk(.2, "2026-11-01T10:00:00Z", false));
  const smile = c.matched.find(m => m.label === "big smile");
  return (c.days === 14 && smile && smile.rows[0].beforeDiff > smile.rows[0].nowDiff) || { days: c.days, smile };
});
await test("Trend: one row per capture seen in 2+ visits", () => {
  const vs = [.2, .5, .9].map((L, i) => ({ number: i + 1, date: "2026-11-0" + (i + 1), report: { captures: summarizeAll(routine({ L })) } }));
  const tr = trend(vs);
  return (tr.cols.length === 3 && tr.rows.length >= 4 && tr.rows.every(r => r.values.length === 3)) || tr;
});
await test("AI prompt: contains the therapist's labels, notes and numbers; no thresholds or grades", () => {
  const txt = caseText(caseDataFor(CASES[0]));
  return (/Raise eyebrows/.test(txt) && /Woke up 2 days ago/.test(txt) && /left \d+% less movement/.test(txt) && !/House-Brackmann|Sunnybrook|\b(Mild|Moderate|Marked)\b/.test(txt)) || txt.slice(0, 600);
});
await test("Store: routines and history-field settings round-trip", async () => {
  const st = new MemoryStore();
  await st.saveTemplate({ id: "t1", name: "My palsy routine", items: [{ label: "Relaxed face", seconds: 5, reference: true }] });
  await st.setSetting("historyFields", [{ id: "f1", label: "Ear pain", type: "yesno" }]);
  const tp = await st.listTemplates(), hf = await st.getSetting("historyFields"), dump = await st.exportAll();
  return (tp[0].items[0].reference === true && hf[0].label === "Ear pain" && dump.templates.length === 1 && dump.settings.length === 1) || { tp, hf };
});

document.getElementById("out").innerHTML = tests.map(t => `<li class="${t.ok ? "pass" : "fail"}">${t.ok ? "PASS" : "FAIL"} ${t.name}${t.info ? "<br><code>" + t.info.replace(/</g, "&lt;") + "</code>" : ""}</li>`).join("");
window.__results = tests;
</script>
</body>
</html>
